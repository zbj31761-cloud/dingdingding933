<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft light sage-grey gradient for the camera body matching reference exactly -->
    <linearGradient id="cameraBodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dce3ea" />
      <stop offset="100%" stop-color="#bac7d5" />
    </linearGradient>

    <!-- Subtle soft shadow for the camera lens -->
    <filter id="lensShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Smooth Camera Body Outline with rounded top bump and soft corners -->
  <path
    d="M 68 28 
       C 74 16, 82 12, 92 12 
       L 108 12 
       C 118 12, 126 16, 132 28 
       L 152 28 
       C 174 28, 188 42, 188 64 
       L 188 118 
       C 188 140, 174 152, 152 152 
       L 48 152 
       C 26 152, 12 140, 12 118 
       L 12 64 
       C 12 42, 26 28, 48 28 
       Z"
    fill="url(#cameraBodyGradient)"
  />

  <!-- Top-Right Sensor / Flash Dot -->
  <circle cx="164" cy="52" r="7.5" fill="#f8fafc" />

  <!-- Outer Thick White Lens Ring -->
  <circle cx="100" cy="90" r="46" fill="#ffffff" filter="url(#lensShadow)" />

  <!-- Inner Black Shutter Disc -->
  <circle cx="100" cy="90" r="39" fill="#000000" />

  <!-- Center White Aperture Hole (8-sided polygon) -->
  <polygon 
    points="113.4,95.5 105.5,103.4 94.5,103.4 86.6,95.5 86.6,84.5 94.5,76.6 105.5,76.6 113.4,84.5" 
    fill="#ffffff" 
  />

  <!-- 8 Pinwheel Aperture Blade White Dividing Spokes -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <!-- Blade 1 line -->
    <line x1="113.4" y1="95.5" x2="127.6" y2="117.6" />
    <!-- Blade 2 line -->
    <line x1="105.5" y1="103.4" x2="100" y2="129" />
    <!-- Blade 3 line -->
    <line x1="94.5" y1="103.4" x2="72.4" y2="117.6" />
    <!-- Blade 4 line -->
    <line x1="86.6" y1="95.5" x2="61" y2="90" />
    <!-- Blade 5 line -->
    <line x1="86.6" y1="84.5" x2="72.4" y2="62.4" />
    <!-- Blade 6 line -->
    <line x1="94.5" y1="76.6" x2="100" y2="51" />
    <!-- Blade 7 line -->
    <line x1="105.5" y1="76.6" x2="127.6" y2="62.4" />
    <!-- Blade 8 line -->
    <line x1="113.4" y1="84.5" x2="139" y2="90" />
  </g>
</svg>
